# Rebuilds data/geometry.json from the official district boundaries.
# Boundaries only change after a redistribution, so this runs by hand.

name: Build geometry

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install shapely pyproj

      - run: python scripts/build_geometry.py

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geometry.json
          if git diff --cached --quiet; then echo "Geometry unchanged."; exit 0; fi
          git commit -m "Rebuild district geometry"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          gh workflow run deploy.yml --ref main
